<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ボイドタイム × バイオリズム危険日カレンダー</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fc;
        --panel: #ffffff;
        --text: #1f2430;
        --muted: #5b6273;
        --accent: #4c6fff;
        --danger: #d93b3b;
        --warn: #f59e0b;
        --safe: #1a9a5f;
        --line: #dce1ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      h1 {
        margin-top: 0;
        font-size: 1.6rem;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 8px 24px rgba(28, 41, 75, 0.06);
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        align-items: end;
      }

      label {
        display: block;
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input,
      button {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 1rem;
      }

      button {
        background: var(--accent);
        color: #fff;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }

      button:hover {
        filter: brightness(1.03);
      }

      .calendar-header {
        margin-top: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .calendar-header button {
        width: auto;
        padding: 8px 12px;
      }

      .weekdays,
      .grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
      }

      .weekdays {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .weekdays div,
      .day {
        text-align: center;
        border-radius: 10px;
        padding: 8px 6px;
      }

      .day {
        border: 1px solid var(--line);
        background: #fff;
        min-height: 72px;
        position: relative;
        cursor: pointer;
      }

      .day.out-month {
        opacity: 0.45;
      }

      .day .date {
        font-size: 0.9rem;
        font-weight: 600;
      }

      .day .badge {
        margin-top: 6px;
        display: inline-block;
        padding: 2px 6px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
      }

      .danger {
        border-color: #f8b8b8;
        background: #fff6f6;
      }

      .danger .badge {
        color: #fff;
        background: var(--danger);
      }

      .warn {
        border-color: #f8d69a;
        background: #fffaf0;
      }

      .warn .badge {
        color: #fff;
        background: var(--warn);
      }

      .safe .badge {
        color: #fff;
        background: var(--safe);
      }

      .panels {
        margin-top: 16px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .detail dt {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .detail dd {
        margin: 0 0 10px;
        font-weight: 600;
      }

      .legend {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .legend span {
        font-size: 0.82rem;
        background: #eef2ff;
        color: #3a476d;
        border-radius: 999px;
        padding: 4px 8px;
      }

      .note {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.86rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>ボイドタイム × バイオリズム危険日カレンダー</h1>
      <div class="card">
        <div class="controls">
          <div>
            <label for="birthday">生年月日</label>
            <input id="birthday" type="date" />
          </div>
          <div>
            <label for="targetMonth">表示月</label>
            <input id="targetMonth" type="month" />
          </div>
          <div>
            <button id="buildBtn">カレンダー作成</button>
          </div>
        </div>

        <div class="calendar-header">
          <button id="prevMonth">◀ 前月</button>
          <strong id="monthTitle">-</strong>
          <button id="nextMonth">次月 ▶</button>
        </div>

        <div class="weekdays">
          <div>日</div>
          <div>月</div>
          <div>火</div>
          <div>水</div>
          <div>木</div>
          <div>金</div>
          <div>土</div>
        </div>
        <div class="grid" id="calendarGrid"></div>

        <div class="legend">
          <span>危険日: ボイド + バイオリズム低調</span>
          <span>注意日: どちらか一方が低調</span>
          <span>安定日: 大きな警戒なし</span>
        </div>
        <p class="note">
          ※ ボイドタイムは簡易モデルです（実天文計算ではありません）。占い・心理セルフケア用途としてご利用ください。
        </p>
      </div>

      <div class="panels">
        <div class="card detail">
          <h2 style="margin-top: 0">日付の詳細</h2>
          <dl>
            <dt>選択日</dt>
            <dd id="dDate">-</dd>
            <dt>総合判定</dt>
            <dd id="dScore">-</dd>
            <dt>バイオリズム（身体 / 感情 / 知性）</dt>
            <dd id="dBio">-</dd>
            <dt>ボイド指数</dt>
            <dd id="dVoid">-</dd>
            <dt>コメント</dt>
            <dd id="dComment">-</dd>
          </dl>
        </div>
      </div>
    </div>

    <script>
      const birthdayInput = document.getElementById("birthday");
      const monthInput = document.getElementById("targetMonth");
      const buildBtn = document.getElementById("buildBtn");
      const prevBtn = document.getElementById("prevMonth");
      const nextBtn = document.getElementById("nextMonth");
      const monthTitle = document.getElementById("monthTitle");
      const calendarGrid = document.getElementById("calendarGrid");

      const dDate = document.getElementById("dDate");
      const dScore = document.getElementById("dScore");
      const dBio = document.getElementById("dBio");
      const dVoid = document.getElementById("dVoid");
      const dComment = document.getElementById("dComment");

      const today = new Date();
      monthInput.value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;

      function dateOnly(value) {
        const d = new Date(value);
        d.setHours(0, 0, 0, 0);
        return d;
      }

      function daysBetween(a, b) {
        return Math.floor((a - b) / 86400000);
      }

      function biorhythmScore(date, birth) {
        const day = daysBetween(date, birth);
        const physical = Math.sin((2 * Math.PI * day) / 23);
        const emotional = Math.sin((2 * Math.PI * day) / 28);
        const intellectual = Math.sin((2 * Math.PI * day) / 33);
        const total = (physical + emotional + intellectual) / 3;
        return { physical, emotional, intellectual, total };
      }

      // 簡易ボイドモデル:
      // 月齢の進み方を29.53059日周期で近似し、
      // 「月齢が7.2〜8.0 / 14.6〜15.3 / 22.0〜22.7 / 28.4〜29.2」の日をボイド高めとする。
      function voidIndex(date) {
        const base = new Date("2000-01-06T18:14:00Z").getTime();
        const age = (((date.getTime() - base) / 86400000) % 29.53059 + 29.53059) % 29.53059;
        const windows = [
          [7.2, 8.0],
          [14.6, 15.3],
          [22.0, 22.7],
          [28.4, 29.2],
        ];

        let maxWindowScore = 0;
        for (const [s, e] of windows) {
          if (age >= s && age <= e) {
            const center = (s + e) / 2;
            const dist = Math.abs(age - center);
            const half = (e - s) / 2;
            const score = 1 - dist / half;
            maxWindowScore = Math.max(maxWindowScore, score);
          }
        }

        return {
          age,
          score: maxWindowScore,
        };
      }

      function evaluateDay(date, birth) {
        const bio = biorhythmScore(date, birth);
        const v = voidIndex(date);

        const bioRisk = bio.total < -0.25 ? 1 : bio.total < 0 ? 0.5 : 0;
        const voidRisk = v.score > 0.4 ? 1 : v.score > 0 ? 0.5 : 0;
        const combined = (bioRisk + voidRisk) / 2;

        let label = "安定日";
        let className = "safe";
        if (combined >= 1) {
          label = "危険日";
          className = "danger";
        } else if (combined >= 0.5) {
          label = "注意日";
          className = "warn";
        }

        return {
          bio,
          voidData: v,
          combined,
          label,
          className,
        };
      }

      function toJPDate(date) {
        return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
      }

      function formatFloat(n) {
        return n.toFixed(2);
      }

      function renderDetail(date, result) {
        dDate.textContent = toJPDate(date);
        dScore.textContent = `${result.label}（総合危険度: ${formatFloat(result.combined)}）`;
        dBio.textContent = `身体 ${formatFloat(result.bio.physical)} / 感情 ${formatFloat(result.bio.emotional)} / 知性 ${formatFloat(result.bio.intellectual)}`;
        dVoid.textContent = `月齢 ${formatFloat(result.voidData.age)} ・ ボイド指数 ${formatFloat(result.voidData.score)}`;

        if (result.label === "危険日") {
          dComment.textContent = "重要決定・衝動買い・対人衝突に注意。予定に緩衝時間を入れてください。";
        } else if (result.label === "注意日") {
          dComment.textContent = "判断ミス防止のため、確認を一段階増やすのがおすすめです。";
        } else {
          dComment.textContent = "比較的安定。通常ペースで問題ありません。";
        }
      }

      function generateCalendar() {
        if (!birthdayInput.value) {
          alert("先に生年月日を入力してください。");
          return;
        }

        const [y, m] = monthInput.value.split("-").map(Number);
        const start = new Date(y, m - 1, 1);
        const end = new Date(y, m, 0);
        const birth = dateOnly(birthdayInput.value);

        monthTitle.textContent = `${y}年${m}月`;
        calendarGrid.innerHTML = "";

        const firstDay = start.getDay();
        const totalCells = Math.ceil((firstDay + end.getDate()) / 7) * 7;

        for (let i = 0; i < totalCells; i++) {
          const cellDate = new Date(y, m - 1, i - firstDay + 1);
          const inMonth = cellDate.getMonth() === m - 1;
          const result = evaluateDay(cellDate, birth);

          const btn = document.createElement("button");
          btn.className = `day ${result.className}${inMonth ? "" : " out-month"}`;
          btn.innerHTML = `<div class="date">${cellDate.getDate()}</div><div class="badge">${result.label}</div>`;

          btn.addEventListener("click", () => {
            renderDetail(cellDate, result);
          });

          calendarGrid.appendChild(btn);
        }

        renderDetail(start, evaluateDay(start, birth));
      }

      buildBtn.addEventListener("click", generateCalendar);

      prevBtn.addEventListener("click", () => {
        const [y, m] = monthInput.value.split("-").map(Number);
        const d = new Date(y, m - 2, 1);
        monthInput.value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
        generateCalendar();
      });

      nextBtn.addEventListener("click", () => {
        const [y, m] = monthInput.value.split("-").map(Number);
        const d = new Date(y, m, 1);
        monthInput.value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
        generateCalendar();
      });

      birthdayInput.value = "1990-01-01";
      generateCalendar();
    </script>
  </body>
</html>
